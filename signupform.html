<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account | James Ndayishimiye</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!--SIGN-UP SECTION-->

        <div class="signupDiv" id="signupId">

            <div class="signupContainer">
                <div class="signupNavBar">
                    <a class="brand" href="./index.html"><img src="./Assets/myLoogo.png" alt="myLogoImg" id="logoBtn"></a>
                    <p><span class="myFirstName">James </span><span class="myLastName">Ndayishimiye</span></p>
                </div>
                
                <div class="signupCover">
                    <div class="signupContent">
                        <span class="signupHeader">SIGNUP</span>
                        <div class="formCover">
                            <form id="signupForm" class="signupFormStyle">
                                <label for="audience">I am signing up as a…</label>
                                <select id="audience" name="audience" required>
                                    <option value="">Select an audience</option>
                                    <option value="learner">Student or learner</option>
                                    <option value="school">School or education team</option>
                                    <option value="data">Data analysis client</option>
                                    <option value="software">Software client</option>
                                    <option value="partner">Teaching or project partner</option>
                                </select>

                                <label for="fullName">Full name</label>
                                <input id="fullName" name="fullName" autocomplete="name" required>

                                <label for="phone">Mobile phone</label>
                                <input id="phone" name="phone" type="tel" autocomplete="tel" required>

                                <label for="signupEmail">Email address</label>
                                <input id="signupEmail" name="email" type="email"
                                    autocomplete="email" required>

                                <label for="signupPassword">Password</label>
                                <input id="signupPassword" name="password" type="password"
                                    autocomplete="new-password" minlength="12" required>

                                <label for="confirmPassword">Confirm password</label>
                                <input id="confirmPassword" name="confirmPassword" type="password"
                                    autocomplete="new-password" minlength="12" required>

                                <button id="realSignupBtn" type="submit">Create account</button>
                                <p id="signupStatus" role="status" aria-live="polite"></p>

                                <p>Already have an account? <a href="./index.html#loginId">Sign in</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <script type="module" src="./signup.js"></script>
</body>
</html>
