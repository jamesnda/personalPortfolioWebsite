<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!--SIGN-UP SECTION-->

        <div class="signupDiv" id="signupId">

            <div class="signupContainer">
                <div class="signupNavBar">
                    <img src="./Assets/myLoogo.png" alt="mylogo" id="logoBtn">
                    <p><span class="myFirstName">James </span><span class="myLastName">Ndayishimiye</span></p>
                </div>
                
                <div class="signupCover">
                    <div class="signupContent">
                        <span class="signupHeader">SIGNUP</span>
                        <div class="formCover">
                            <form>
                                <div class="signupFormgroup">
                                    <label for="subject">Who am I? *</label>
                                    <select name="subject" id="subject" class="form-input">
                                        <option value="">----Select Your Role Here----</option>
                                        <option value="BusinessClient">Business Client</option>
                                        <option value="CodingEducation">Coding Student (Beginner to Advanced)</option>
                                        <option value="CodingEducation">Coding Instructor/Teacher</option>
                                        <option value="MathematicsEducation">Mathematics Student</option>
                                        <option value="MathematicsEducation">Mathematics Instructor/Teacher</option>
                                        <option value="MathematicsEducation">Parent / Guardian</option>
                                        <option value="EdTech">Educational Investor / Sponsor</option>
                                        <option value="SchoolAdministrator">School Administrator</option>
                                        <option value="Full-Stack">Collaboration Partner</option>
                                        <option value="GeneralCommunityMember">General Community Member</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="signupFormgroup">
                                    <label for="names">Full Names *</label>
                                    <input type="text" id="names" class="signup-form-input" placeholder="eg. John Doe">
                                </div>

                                <div class="signupFormgroup">
                                    <label for="telephone">Mobile Phone *</label>
                                    <input type="telephone" id="telephone" class="signup-form-input" placeholder="eg. +250 788 000 000">
                                </div>

                                <div class="signupFormgroup">
                                    <label for="email">Email Address *</label>
                                    <input type="email" id="email" class="signup-form-input" placeholder="eg. example1@gmail.com">
                                </div>

                                <div class="signupFormgroup">
                                    <label for="password">Password *</label>
                                    <input type="password" id="password" class="signup-form-input" placeholder="****************">
                                </div>

                                <div class="signupFormgroup">
                                    <label for="password">Confirm Password *</label>
                                    <input type="password" id="confirmPassword" class="signup-form-input" placeholder="****************">
                                </div>

                                <div class="signupFormgroup">
                                    <button id="realSignupBtn" type="signup">CREATE ACCOUNT</button>
                                    <div class="createAccountDiv">Already have an account?<a href="./index.html.#loginId" id="loginToAccountId">Login</a></div>
                                </div>
                    
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
</body>
</html>
