<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!--SIGN-UP SECTION-->

        <div class="signupDiv" id="signupId">

            <div class="signupContainer">
                <div class="signupNavBar">
                    <a href="./index.html"><img src="./Assets/myLoogo.png" alt="myLogoImg" id="logoBtn"></a>
                    <p><span class="myFirstName">James </span><span class="myLastName">Ndayishimiye</span></p>
                </div>
                
                <div class="signupCover">
                    <div class="signupContent">
                        <span class="signupHeader">SIGNUP</span>
                        <div class="formCover">
                            <form id="signupForm" class="signupFormStyle">
                                <label for="role">I am a…</label>
                                <select id="role" name="role" required>
                                    <option value="">Select a role</option>
                                    <option value="student">Student</option>
                                    <option value="educator">Educator</option>
                                    <option value="client">Business client</option>
                                    <option value="other">Other</option>
                                </select>

                                <label for="fullName">Full name</label>
                                <input id="fullName" name="fullName" autocomplete="name" required>

                                <label for="phone">Mobile phone</label>
                                <input id="phone" name="phone" type="tel" autocomplete="tel" required>

                                <label for="signupEmail">Email address</label>
                                <input id="signupEmail" name="email" type="email"
                                    autocomplete="email" required>

                                <label for="signupPassword">Password</label>
                                <input id="signupPassword" name="password" type="password"
                                    autocomplete="new-password" minlength="12" required>

                                <label for="confirmPassword">Confirm password</label>
                                <input id="confirmPassword" name="confirmPassword" type="password"
                                    autocomplete="new-password" minlength="12" required>

                                <button id="realSignupBtn" type="submit">Create account</button>
                                <p id="signupStatus" role="status" aria-live="polite"></p>

                                <p>Already have an account? <a href="./index.html#loginId">Sign in</a></p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</body>
<script>
    import { supabase } from "./supabaseClient.js";

const signupForm = document.querySelector("#signupForm");
const signupStatus = document.querySelector("#signupStatus");

signupForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = event.currentTarget;
    const password = form.elements.password.value;

    if (password !== form.elements.confirmPassword.value) {
        signupStatus.textContent = "The passwords do not match.";
        form.elements.confirmPassword.focus();
        return;
    }

    const submitButton = form.querySelector('[type="submit"]');
    submitButton.disabled = true;
    signupStatus.textContent = "Creating your account...";

    try {
        const { data, error } = await supabase.auth.signUp({
            email: form.elements.email.value.trim(),
            password,
            options: {
                data: {
                    full_name: form.elements.fullName.value.trim(),
                    phone: form.elements.phone.value.trim(),
                    requested_role: form.elements.role.value
                }
            }
        });

        if (error) throw error;

        if (data.session) {
            window.location.assign("./dashboard.html");
        } else {
            signupStatus.textContent =
                "Account created. Check your email to confirm it, then sign in.";
        }
    } catch (error) {
        signupStatus.textContent =
            error.message || "Account creation failed. Please try again.";
    } finally {
        submitButton.disabled = false;
    }
});



</script>
</html>
