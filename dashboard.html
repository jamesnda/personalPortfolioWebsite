<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome To My Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

        <!--DASHBOARD SECTION FOR SOCIAL MEDIA-->
    <div class="dashboardSection">
        <div class="dashboardDiv">
            <div class="dashboardNavbar">
                <div class="logo"><img src="./Assets/myLoogo.png" alt="mylogo" id="logoBtn"></div>
                <div>
                    <form>
                        <input type="text" placeholder="Search courses, clients, resources..." class="searchBar">
                    </form>
                </div>
                <div class="notifications"><img src="./Assets/NotificationsIcon.png" alt="notificationImage" id="notifications"></div>
                <div class="messages"><img src="./Assets/messageIcon.jpeg" alt="MessagesImage" id="messages"></div>
                <div class="profileDiv">
                        <img src="./Assets/ProfileIcon.png" alt="Profile Avatar" class="userPhoto">
                        <span class="userName">James Ndayishimiye</span>
                        <span class="userRole">Admin</span>
                        <span class="userLogout">Logout</span>
                </div>
            </div>
            <div class="dashboardContentArea">
                <div class="sideBar">
                    <div class="mainSidebarDashboardMenu">
                        <div class="dashboardBtn">
                            <img src="./Assets/dashboardIcon.png" alt="dashboardIcon" class="dashboardIcons">
                            <span>Dashboard</span>
                        </div>
                        <div class="myRoleBtn">
                            <img src="./Assets/roleIcon.png" alt="myRoleIcon" class="dashboardIcons">
                            <span>User Role</span>
                        </div>
                        <div class="statisticsBtn">
                            <img src="./Assets/statisticsIcon.png" alt="statisticsIcon" class="dashboardIcons">
                            <span>Statistics</span>
                        </div>
                        <div class="learningHubBtn ">
                            <img src="./Assets/learningHubIcon.png" alt="learningHubIcon" class="dashboardIcons">
                            <span>Learning Hub</span>
                        </div>
                        <div class="projectsBtn">
                            <img src="./Assets/projectsIcon.png" alt="projectsHubIcon" class="dashboardIcons">
                            <span>Projects</span>
                        </div>
                        <div class="analyticsBtn">
                            <img src="./Assets/analyticsIcon.png" alt="AnalyticsIcon" class="dashboardIcons">
                            <span>Analytics</span>
                        </div>
                        <div class="resourcesBtn">
                            <img src="./Assets/resourcesIcon.png" alt="ResourcesIcon" class="dashboardIcons">
                            <span>Resources</span>
                        </div>
                        
                        
                    </div>
                    <div class="supportDiv">
                        <div class="helpDiv">
                            <img src="./Assets/helpIcon.png" alt="HelpIcon" class="dashboardIcons">
                            <span>Help</span>
                        </div>
                        
                        <div class="settingsDiv">
                            <img src="./Assets/settingsIcon.png" alt="SettingsIcon" class="dashboardIcons">
                            <span>Settings</span>
                        </div>
                        
                        
                    </div>
                    
                </div>
                <div class="mainContent">
                    <div class="dashboardContent">

                    </div>

                    <div class="dashboardContent">
                        
                    </div>

                    <div class="dashboardContent">
                        
                    </div>

                    <div class="dashboardContent">
                        
                    </div>

                    <div class="dashboardContent">
                        
                    </div>

                    <div class="dashboardContent">
                        
                    </div>

                    <div class="dashboardContent">
                        
                    </div>
                </div>
            </div>
        
            <!--FOOTER SECTION FOR SOCIAL MEDIA-->
        <div class="footerSocialMediaDiv">
            <div class="faceBook">
                <a href="" target="_blank"><button id="fbIcon"><img src="./Assets/fbImg.png" alt="fbImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="xTwitter">
                <a href="" target="_blank"><button id="xIcon"><img src="./Assets/xImg.png" alt="xImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="instagram">
                <a href="" target="_blank"><button id="instIcon"><img src="./Assets/instImg.png" alt="instImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="gitHub">
                <a href="https://github.com/jamesnda" target="_blank"><button id="gitIcon"><img src="./Assets/gitImg.png" alt="gitImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="youTube">
                <a href="https://www.youtube.com/@mr.ndayishimiyejamesmrs.im226" target="_blank"><button id="ytIcon"><img src="./Assets/ytubeImg.png" alt="ytubeImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="whatsApp">
                <a href="https://wa.me/250785795423?text=Hello%2C%20I’m%20James%20Ndayishimiye.%20I’m%20a%20Full-Stack%20Developer%20and%20Math%20Educator." target="_blank"><button id="whtspIcon"><img src="./Assets/whtspImg.png" alt="whtspImg" class="socialMediaBtn"></button></a>
            </div>
            <div class="linkedIn">
                <a href="https://www.linkedin.com/in/ndayishimiye-james-b54592131/" target="_blank"><button id="lnkdIcon"><img src="./Assets/lnkdInImg.png" alt="lnkdInImg" class="socialMediaBtn"></button></a>
