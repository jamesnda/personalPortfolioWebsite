<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | James Ndayishimiye</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./reset-password.js"></script>
</head>
<body>
    <main class="loginDiv">
        <div class="loginContainer">
            <a class="brand" href="./index.html" aria-label="James Ndayishimiye, portfolio home">
                <img src="./Assets/myLoogo.png" alt="">
                <span>James Ndayishimiye</span>
            </a>
            <div class="loginCover">
                <div class="loginContent">
                    <h1 class="loginHeader">Reset password</h1>
                    <form id="requestResetForm" class="loginFormStyle">
                        <p>Enter your account email and we’ll send you a password reset link.</p>
                        <label for="resetEmail">Email address</label>
                        <input id="resetEmail" name="email" type="email" class="login-form-input" autocomplete="email" required>
                        <button type="submit">Send reset link</button>
                    </form>
                    <form id="newPasswordForm" class="loginFormStyle" hidden>
                        <label for="newPassword">New password</label>
                        <input id="newPassword" name="password" type="password" class="login-form-input" autocomplete="new-password" minlength="12" required>
                        <label for="confirmNewPassword">Confirm new password</label>
                        <input id="confirmNewPassword" name="confirmPassword" type="password" class="login-form-input" autocomplete="new-password" minlength="12" required>
                        <button type="submit">Update password</button>
                    </form>
                    <p id="resetStatus" role="status" aria-live="polite"></p>
                    <a href="./index.html#loginId">Back to sign in</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
